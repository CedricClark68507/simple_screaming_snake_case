[project]
name = "simple-screaming-snake-case"
version = "0.1.1"
description = "A focused Python utility that converts identifier names between camelCase, PascalCase, snakecase, and SCREAMINGSNAKECASE."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
